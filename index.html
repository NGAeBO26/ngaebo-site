<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- 🎯 SYNCHRONOUS SAFARI RELOAD TINTING INTERCEPTOR -->
    <script>
      (function() {
        var path = window.location.pathname.toLowerCase();
        
        // 1. Immediately isolate or construct the meta theme element
        var meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'theme-color');
          document.head.appendChild(meta);
        }

        // 2. Route Check: Force colors before Safari paints the layout
        if (path === '/rides') {
          meta.setAttribute('content', '#236ea0'); // Forehead status bar color
          document.documentElement.style.backgroundColor = '#236ea0'; // Chin floating URL bar color
          document.documentElement.style.colorScheme = 'light';
        } else {
          meta.setAttribute('content', '#3b593a'); // Forehead global forest green color
          document.documentElement.style.backgroundColor = 'var(--brand-forest)'; // Chin global forest green color
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>

    <title>northgeorgiaebikes</title>
    <meta
      name="description"
      content="North Georgia eBikes — local e-bike routes, trail info, and resources for riders in North Georgia."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>

    <script async src="https://embed.reddit.com/widgets.js"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
